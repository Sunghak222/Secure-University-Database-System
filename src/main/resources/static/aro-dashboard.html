<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ARO Dashboard</title>
    <link rel="stylesheet" href="arodashboard.css" />
</head>

<body>
    <div class="dashboard-container">
        <header>
            <h2>Welcome, ARO</h2>
            <button id="logoutBtn">Logout</button>
        </header>

        <section class="dashboard-section">
            <h3>🔍 Search Student Grades</h3>
            <form id="searchForm">
                <input type="text" id="search_student_id" placeholder="Student ID" />
                <input type="text" id="search_course" placeholder="Course Code" />
                <button type="submit">Search</button>
            </form>
        </section>

        <section class="dashboard-section">
            <h3>📋 Grade Records</h3>
            <table class="info-table">
                <thead>
                    <tr>
                        <th>Student ID</th>
                        <th>Course</th>
                        <th>Term</th>
                        <th>Grade</th>
                        <th>Comments</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="grades_table">
                    <!-- JS will inject rows here -->
                </tbody>
            </table>
        </section>

        <section class="dashboard-section">
            <h3>➕ Add New Grade</h3>
            <form id="addGradeForm">
                <input type="text" id="new_student_id" placeholder="Student ID" required />
                <input type="text" id="new_course_id" placeholder="Course ID" required />
                <input type="text" id="new_term" placeholder="Term (e.g. 202526S1)" required />
                <input type="text" id="new_grade" placeholder="Grade (e.g. A, B+)" required />
                <input type="text" id="new_comments" placeholder="Comments" required />
                <button type="submit">Add Grade</button>
            </form>
        </section>

        <!-- Edit Grade Modal -->
        <section id="editGradeModal" class="dashboard-section" style="display: none;">
            <h3>✏️ Edit Grade</h3>
            <form id="editGradeForm">
                <p><strong>Grade ID:</strong> <span id="edit_grade_id"></span></p>
                <p><strong>Student ID:</strong> <span id="edit_student_id"></span></p>
                <p><strong>Course ID:</strong> <span id="edit_course_id"></span></p>
                <input type="text" id="edit_term" placeholder="Term (e.g. 202526S1)" required />
                <input type="text" id="edit_grade" placeholder="Grade (e.g. A, B+)" required />
                <input type="text" id="edit_comments" placeholder="Comments" />
                <button type="submit">Save Changes</button>
                <button type="button" id="cancelEditBtn">Cancel</button>
            </form>
        </section>
    </div>

    <script src="aro.js"></script>
</body>

</html>
