version: '3.8'

services:
  # Database service
  percona:
    image: percona:8.0
    container_name: securedb-percona
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: securedb
      MYSQL_USER: comp3335
      MYSQL_PASSWORD: secure_password
    ports:
      - "3306:3306"
    volumes:
      - percona_data:/var/lib/mysql
    networks:
      - securedb-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: --default-authentication-plugin=mysql_native_password

  # Spring Boot backend (includes static frontend)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: securedb-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://percona:3306/securedb?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: comp3335
      SPRING_DATASOURCE_PASSWORD: secure_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: create
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_SQL_INIT_MODE: always
      SERVER_PORT: 8080
    depends_on:
      percona:
        condition: service_healthy
    networks:
      - securedb-network
    restart: unless-stopped

networks:
  securedb-network:
    driver: bridge

volumes:
  percona_data:
